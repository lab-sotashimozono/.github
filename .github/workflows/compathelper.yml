name: CompatHelper

# Reusable CompatHelper — opens `[compat]` bump PRs.
#
# TWO REGISTRIES, and the second is why internal `[compat]` bounds used to be bumped by hand.
# CompatHelper resolves "latest version" by looking a dependency's UUID up in a reachable REGISTRY
# (`get_latest_version!`, CompatHelper/src/dependencies.jl) — it has NO code path that reads
# `[sources]`. Our internal packages are private and were registered nowhere (General takes public
# packages only), so `latest_version` stayed `nothing` and every one of them was skipped silently.
# That is what ParameterizedITensor#159 was: ParaLinearAlgebra crossed minor bounds repeatedly and
# the downstream bound had to be opened by hand each time.
#
# `LabRegistry` (private, org-owned) fixes exactly that. Its own nightly `Sync` job keeps it
# current, an hour before this cron.
#
# ITS ROLE IS CHANGING (lab-sotashimozono/.github#20). This header used to end "the registry only
# makes a version NUMBER discoverable — the fleet pins internal deps `[sources] rev = \"main\"` on
# purpose and that still decides the commit". The fleet is moving OFF `[sources]`: because
# `VersionCheck` forces a bump on every PR and `AutoRegister` registers it, the latest registered
# version IS main, minutes behind, so the pins bought nothing while costing CompatHelper visibility
# and a transitive re-declaration in every consumer. ParameterizedITensor.jl#172 is the first edge.
#
# That promotes THIS workflow: with `[sources]` gone, the bump PR opened here is the fleet's
# integration test — the place a breaking upstream change actually gets run against a dependent.
# `downstream-ci.yml` stays as an early warning, but a dispatched dependent resolves its own pinned
# version and so cannot be that test. Which is why the duplicate-PR hygiene below is not cosmetic.
#
# MEASURED before wiring it up, on ParameterizedITensor's Project.toml with the bounds tightened so
# a bump was required:
#
#     dep                 compat        General only    General + LabRegistry
#     ComplexAnalysis     0.1           NOT FOUND       0.1.81
#     FunctionMeasures    0.1.60        NOT FOUND       0.1.73
#     ParaLinearAlgebra   0.23          NOT FOUND       0.26.2
#     ITensors (control)  0.7, 0.8, 0.9 0.9.30          0.9.30
# PR-authoring token precedence (resolved locally in the step; never written to output/env):
#   1. BOT_PAT (org secret) — delivered to PUBLIC repos on Free.
#   2. self-hosted runner's `gh auth token` — the SAME login CI uses to clone private
#      lab-sotashimozono [sources] deps; gives PRIVATE repos a CI-triggering PR author with
#      no repo secret. A PAT-authored PR triggers CI; github.token does not.
#   3. github.token — last resort (PR opens but does NOT trigger CI / auto-merge).
on:
  workflow_call:
    inputs:
      # `runs-on` as JSON. **Leave unset** and the pool follows the CALLER's visibility —
      # private -> rosina, public -> ubuntu-latest. Canonical note: `autoregister.yml`.
      runner:
        type: string
        default: ''
jobs:
  compathelper:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || (github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest') }}
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Run CompatHelper
        shell: bash
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          FALLBACK: ${{ github.token }}
        run: |
          cred="$BOT_PAT"
          if [ -z "$cred" ] && command -v gh >/dev/null 2>&1; then
            cred="$(gh auth token 2>/dev/null || true)"
          fi
          [ -z "$cred" ] && cred="$FALLBACK"
          echo "::add-mask::$cred"
          # PROBE, do not assume. `LabRegistry` is PRIVATE, so a runner without the org login
          # cannot clone it — and CompatHelper treats a registry it was told about and cannot
          # fetch as a hard error, which would take the whole job down. The public repos in this
          # org have no internal `[sources]` deps (they could not: a public package cannot depend
          # on a private one), so for them the registry is not merely unreachable, it is
          # unnecessary. One `ls-remote` decides it, and the fallback is exactly today's behaviour.
          LAB_REGISTRY=0
          if git ls-remote "https://github.com/lab-sotashimozono/LabRegistry.git" HEAD \
               >/dev/null 2>&1; then
            LAB_REGISTRY=1
            echo "LabRegistry reachable — internal [compat] bounds are in scope"
          else
            echo "LabRegistry unreachable from this runner — General only (unchanged behaviour)"
          fi
          LAB_REGISTRY="$LAB_REGISTRY" GITHUB_TOKEN="$cred" julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add("CompatHelper")
            using CompatHelper
            regs = Pkg.RegistrySpec[Pkg.RegistrySpec(;
                name = "General",
                uuid = "23338594-aafe-5451-b93e-139f81909106",
                url  = "https://github.com/JuliaRegistries/General.git",
            )]
            if ENV["LAB_REGISTRY"] == "1"
                push!(regs, Pkg.RegistrySpec(;
                    name = "LabRegistry",
                    uuid = "fc499065-e3ff-468f-be43-caddc0e4b170",
                    url  = "https://github.com/lab-sotashimozono/LabRegistry.git",
                ))
            end
            CompatHelper.main(; registries = regs)'

          # ---- collapse duplicate bump PRs -------------------------------------------------
          #
          # CompatHelper decides "is there already an open PR for this bump?" through the SEARCH
          # API, which returns nothing for PRIVATE-repo content under any token we have here — the
          # same blindness that made release notes say "No merged pull requests". So on a private
          # repo it does not find its own PR and opens a NEW one every run. Measured 2026-08-02 on
          # ITensorPartitionFunctions.jl: three byte-identical `QAtlas -> 0.31` PRs (#17, #18, #19)
          # created 12:49, 16:42, 20:40 — one per scheduled run, i.e. ~6/day/dependency.
          #
          # The REST *list* endpoint DOES work on a private repo (it is `--search` specifically that
          # is blind), so dedupe is possible here even though CompatHelper cannot do it itself.
          # Group the open `compathelper/*` PRs by TITLE — which encodes dep, section and target
          # version, so identical titles really are the same bump — and keep only the newest.
          #
          # Runs AFTER CompatHelper so this run's own PR is included and the collapse is immediate.
          # Hygiene, never correctness: any failure here is reported and ignored.
          set +e
          echo "--- collapsing duplicate compathelper PRs ---"
          open_prs=$(GH_TOKEN="$cred" gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                       --json number,title,headRefName,createdAt 2>/dev/null)
          if [ -z "$open_prs" ]; then
            echo "could not list PRs — skipping dedupe"
          else
            # newest per title kept; every older one with the same title closed
            stale=$(printf '%s' "$open_prs" | jq -r '
              [ .[] | select(.headRefName | startswith("compathelper/")) ]
              | group_by(.title)
              | map(sort_by(.createdAt) | reverse | .[1:])
              | flatten | .[] | "\(.number)"' 2>/dev/null)
            if [ -z "$stale" ]; then
              echo "no duplicates"
            else
              for n in $stale; do
                echo "  closing duplicate #$n"
                GH_TOKEN="$cred" gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "Superseded by a newer CompatHelper run proposing the same bump. Closed automatically: CompatHelper cannot see its own open PRs on a private repo (its check uses the search API, which is blind there), so it re-opens one every run." \
                  >/dev/null 2>&1 || echo "    close FAILED for #$n"
              done
            fi
          fi
