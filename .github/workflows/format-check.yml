name: Format Check

# Reusable JuliaFormatter check. The pool follows the CALLER's visibility unless `runner` is
# passed — private → rosina, public → ubuntu-latest. Canonical note: `autoregister.yml`.
#
# `Pkg.activate(; temp=true)` is load-bearing — do not "simplify" it away. Installing into the
# runner's shared/default environment lets that depot's existing compat bounds cap the resolve: on
# rosina a floating spec silently resolved to JuliaFormatter 2.3.2 while a laptop resolved 2.10.1,
# and a leftover ITensorFormatter there once made the install fail outright. Same code, different
# verdict, which is the long-standing "format-check flake". It was never a flake, it was the
# shared env, and that is the half worth defending.
#
# The version floats, deliberately. When a new 2.x reflows files the answer is to adopt it and
# reformat, not to freeze the old one: a pin here becomes standing debt in every caller and rots
# while the ecosystem moves. Reproducibility comes from the clean env above, not from the pin.
#
# Format locally with the same floating spec, in a temp env, so you resolve what CI just did:
#   julia -e 'using Pkg; Pkg.activate(;temp=true); Pkg.add(PackageSpec(name="JuliaFormatter",
#             version="2")); using JuliaFormatter; format(".")'
on:
  workflow_call:
    inputs:
      # `runs-on` as JSON. **Leave unset** and the pool follows the CALLER's visibility —
      # private -> rosina, public -> ubuntu-latest. Canonical note: `autoregister.yml`.
      runner:
        type: string
        default: ''

jobs:
  format-check:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || (github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: JuliaFormatter check
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)                       # clean env — no depot compat capping the resolve
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2"))
          using JuliaFormatter
          v = pkgversion(JuliaFormatter)
          # `using` falls back to the depot's default env when the active project does not declare
          # the package, loading a different version and saying nothing, so ask the project itself.
          declared = [p.version for (_, p) in Pkg.dependencies() if p.name == "JuliaFormatter"]
          if declared != [v]
              println(stderr, "❌ JuliaFormatter $v came from outside the temp project, which holds $declared.")
              exit(1)
          end
          @info "JuliaFormatter $v"
          ok = format("."; verbose = true, overwrite = false)
          if !ok
              println(stderr, "❌ Not formatted, under JuliaFormatter $v. `overwrite=false` above is the check;")
              println(stderr, "   locally you want `true`, and one pass does not always converge. Run:")
              println(stderr, "   julia -e 'using Pkg; Pkg.activate(;temp=true); Pkg.add(PackageSpec(name=\"JuliaFormatter\", version=\"2\")); using JuliaFormatter; for _ in 1:5; format(\".\"; overwrite=true) && break end'")
              exit(1)
          end
          println("✅ All files properly formatted.")
