name: Downstream CI

# Reusable. When a lab package makes a BREAKING version bump on main — for a 0.x package a MINOR bump,
# for a >=1.0 package a MAJOR bump — find the lab-sotashimozono repos that DIRECTLY depend on it and
# trigger THEIR CI (workflow_dispatch), so breakage is caught immediately.
#
# DEPENDENTS ARE FOUND BY **UUID**, not by `[sources]`. This header used to say `[sources]`, which was
# true of the first version and has not been true since the UUID match went in (see the comment at the
# matching step, and the ComplexTimeEvolution weakdep case it was written for). The stale wording cost
# real time on 2026-08-02: it was read as the implementation and made the `[sources]` -> LabRegistry
# migration look blocked on rewiring this workflow, which it is not. UUID matching covers `[deps]`,
# `[weakdeps]` and `[extras]`, so detection survives a repo dropping `[sources]` entirely.
# Internal deps track rev="main" (which CompatHelper cannot see). DIRECT dependents only + dispatching
# CI.yml (which does not bump a version) => cannot loop, even on circular deps. Fire-and-forget: a
# failing downstream run surfaces in that repo's own Actions tab + failure notifications. A manual
# workflow_dispatch on the caller forces the fan-out (skips the version check) for testing.
#
# WHY THIS EXISTS, measured 2026-07-30. `ParaLinearAlgebra` went 0.9.2 -> 0.23.4 in one sitting —
# fourteen breaking minors — and every one of them escaped the enumerated `[compat]` bounds in seven
# downstream repos. `Pkg` then refused to resolve and every shard died before running a test. Nothing
# reported it: CompatHelper reads the registry and these deps arrive through `[sources] rev="main"`,
# and the affected repos' CI was not triggered by anything, so they sat green-looking for weeks. One
# of them (ComplexTimeEvolution) had been red since 2026-07-19. They were found by accident, when an
# unrelated one-line workflow PR happened to run a suite.
#
# This workflow is the thing that was missing. Each of those fourteen bumps would have dispatched the
# dependents and gone red on the spot. See lab-sotashimozono/.github#16.
#
# `BOT_PAT` is a REPO-level secret in each provider, not an org one: on the free plan org secrets are
# withheld from private repos, so an org-level BOT_PAT would arrive empty here.

on:
  workflow_call:
    inputs:
      # `runs-on` as JSON: '"ubuntu-latest"' or '["self-hosted","rosina"]'.
      #
      # Hosted by default because this reusable also serves PUBLIC callers, and the org runner group
      # is `allows_public: false` — a public repo asking for the pool does not fail, it QUEUES
      # FOREVER. Private callers opt in: only private repos consume the org's 2000 included
      # minutes/month, and measured 2026-08-09 this was one of only two hosted jobs still firing
      # regularly across the private fleet.
      runner:
        type: string
        default: '"ubuntu-latest"'
    secrets:
      BOT_PAT:
        required: true

jobs:
  downstream:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide whether to fan out
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch - forcing the downstream fan-out"; exit 0
          fi
          PREV=$(git show HEAD~1:Project.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
          CURR=$(grep '^version' Project.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          go=false
          if [ -n "$PREV" ] && [ "$PREV" != "$CURR" ]; then
            IFS=. read -r pM pm _ <<< "$PREV"
            IFS=. read -r cM cm _ <<< "$CURR"
            if   [ "${cM:-0}" -gt "${pM:-0}" ]; then go=true
            elif [ "$cM" = "$pM" ] && [ "$pM" = "0" ] && [ "${cm:-0}" -gt "${pm:-0}" ]; then go=true
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "version: ${PREV:-none} -> $CURR  (breaking=$go)"

      - name: Trigger the CI of direct dependents
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          set +e
          ME="${{ github.repository }}"; ORG="${ME%%/*}"; NAME="${ME##*/}"
          # Match on our own UUID, not on the `[sources]` URL. The URL only appears for deps pinned
          # to a git rev, so a dependent that takes us as a WEAKDEP (an extension) with a `[compat]`
          # bound and no `[sources]` entry was invisible — and those break too: ComplexTimeEvolution
          # holds ParaLinearAlgebra exactly that way and its bound was one of the seven that died in
          # the 0.9 -> 0.23 march. A UUID also cannot be matched by prose: that repo's Project.toml
          # names "ParaLinearAlgebra" in a comment, which a name grep would have counted.
          ME_UUID=$(grep -m1 '^uuid' Project.toml | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$ME_UUID" ]; then echo "::error::no uuid in Project.toml"; exit 1; fi
          echo "matching dependents on uuid=$ME_UUID"
          repos=$(gh api "orgs/$ORG/repos?per_page=100&type=all" --paginate --jq '.[] | select(.archived==false) | .name' 2>&1)
          rc=$?
          echo "repo list rc=$rc count=$(printf '%s\n' "$repos" | grep -c .)"
          if [ $rc -ne 0 ]; then echo "::error::cannot list org repos: $(printf '%s' "$repos" | head -c 200)"; exit 1; fi
          n=0
          for r in $repos; do
            [ "$ORG/$r" = "$ME" ] && continue
            pt=$(gh api "repos/$ORG/$r/contents/Project.toml" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
            # uuid covers [deps], [weakdeps] and [extras]; the URL form is kept as an OR for a repo
            # that pins the source without listing us as a dep.
            printf '%s' "$pt" | grep -qF "$ME_UUID" || printf '%s' "$pt" | grep -qF "$ORG/$NAME" || continue
            echo "  dependent: $r"
            if gh workflow run CI.yml --repo "$ORG/$r" --ref main 2>&1; then echo "    dispatched"; n=$((n+1)); else echo "    dispatch FAILED"; fi
          done
          echo "::notice::Dispatched $n downstream CI run(s)."
