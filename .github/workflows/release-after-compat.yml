name: Release after compat

# THE LINK COMPATHELPER DOES NOT FILE.
#
# Widening a dependency's `[compat]` takes THREE steps, and CompatHelper only ever files the two
# ends of them:
#
#     upstream widens (CompatHelper)  →  upstream RELEASES (nobody)  →  downstream widens (CompatHelper)
#
# The middle one is not optional. A registered package's compat is FROZEN at its registered
# version, so a widening that lands on an already-registered version is invisible downstream: the
# resolver keeps reading the old entry and keeps picking the old dependency. `AutoRegister` cannot
# help — it fires on a version CHANGE (`autoregister.yml`, "Detect version bump"), and a
# CompatHelper merge does not change the version.
#
# MEASURED 2026-08-24/25, sweeping the fleet to FunctionMeasures 0.34: SEVEN releases had to be
# opened by hand for one widening to reach the leaves — ComplexAnalysis 0.24.10,
# ParaLinearAlgebra 0.60.10, StructuredITensors 0.1.51, ParameterizedITensor 0.26.10,
# ITensorcMPS 0.1.9, ITensorPartitionFunctions 0.1.12, ITensorMPSKit 0.1.8. Every hop stalled with
# BOTH CompatHelper PRs open, each looking like it was waiting on the other. 41 stalled bump PRs
# had accumulated behind it.
#
# WHY THIS AND NOT A BUMP INSIDE THE COMPATHELPER PR. That is the obvious fix and it is worse:
# CompatHelper opens one PR per dependency, so N of them would all bump the SAME version line from
# the SAME base, and every merge after the first would conflict. Batching the release AFTER the
# merges keeps the version line single-writer — N compat merges produce ONE release PR.
#
# WHY IT CANNOT LOOP. It fires only when a push changed `[compat]` and left `version` alone. The
# release PR it opens changes `version` and not `[compat]`, so merging it does not re-trigger.

on:
  workflow_call:
    inputs:
      runner:
        description: '`runs-on` as JSON. Leave unset to follow the caller''s visibility.'
        type: string
        default: ''

jobs:
  release-pr:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || (github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Did this push widen compat without bumping the version?
        id: need
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "need=0" >> "$GITHUB_OUTPUT"; echo "no parent commit — nothing to compare"; exit 0
          fi
          # `[compat]` runs to the next section header or EOF.
          compat_of() { sed -n '/^\[compat\]/,/^\[/p' | grep -vE '^\[' | grep -vE '^\s*$' | sort; }
          PREV_C=$(git show HEAD~1:Project.toml 2>/dev/null | compat_of || true)
          CURR_C=$(compat_of < Project.toml || true)
          PREV_V=$(git show HEAD~1:Project.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
          CURR_V=$(grep '^version' Project.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version: ${PREV_V:-<none>} -> $CURR_V"
          if [ "$PREV_C" = "$CURR_C" ]; then
            echo "need=0" >> "$GITHUB_OUTPUT"; echo "[compat] unchanged — nothing to release"; exit 0
          fi
          if [ "$PREV_V" != "$CURR_V" ]; then
            echo "need=0" >> "$GITHUB_OUTPUT"
            echo "[compat] changed AND version bumped in the same commit — AutoRegister has it"; exit 0
          fi
          echo "need=1" >> "$GITHUB_OUTPUT"
          echo "curr=$CURR_V" >> "$GITHUB_OUTPUT"
          echo "[compat] changed with no version bump — a release is needed"
          diff <(printf '%s\n' "$PREV_C") <(printf '%s\n' "$CURR_C") || true

      - name: Open the release PR
        if: steps.need.outputs.need == '1'
        shell: bash
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          FALLBACK: ${{ github.token }}
          CURR: ${{ steps.need.outputs.curr }}
        run: |
          set -euo pipefail
          cred="${BOT_PAT:-}"
          [ -z "$cred" ] && cred="$FALLBACK"
          echo "::add-mask::$cred"
          export GH_TOKEN="$cred"

          # IDEMPOTENT. Several compat PRs can merge in a row; the first opens the release PR and
          # the rest must not open a second one. The existing PR simply releases them all — its
          # branch is cut from main each time it is (re)created, so whatever merged before it is
          # already included.
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
               --json headRefName --jq '.[].headRefName' | grep -q '^chore/release-after-compat$'; then
            echo "a release PR is already open — it will carry this widening too"; exit 0
          fi

          IFS='.' read -r MA MI PA <<< "$CURR"
          NEXT="${MA}.${MI}.$((PA + 1))"
          echo "bumping $CURR -> $NEXT"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/release-after-compat
          sed -i "0,/^version = \"$CURR\"/s//version = \"$NEXT\"/" Project.toml
          grep '^version' Project.toml
          git add Project.toml
          MSG="chore: release $NEXT — carry the compat widening downstream"
          MSG="$MSG"$'\n\n'"A [compat] widening landed on $CURR, which is ALREADY REGISTERED."
          MSG="$MSG"$'\n'"A registered package's compat is frozen at its registered version, so the"
          MSG="$MSG"$'\n'"widening is invisible downstream until a new version ships: the resolver"
          MSG="$MSG"$'\n'"keeps reading the old entry and keeps picking the old dependency."
          MSG="$MSG"$'\n\n'"CompatHelper files the two ENDS of each hop — upstream widen, downstream"
          MSG="$MSG"$'\n'"widen — and never the release between them, and AutoRegister fires on a"
          MSG="$MSG"$'\n'"version CHANGE, which a CompatHelper merge is not. This is that missing"
          MSG="$MSG"$'\n'"middle link, opened automatically by release-after-compat.yml."
          MSG="$MSG"$'\n\n'"Backward-compatible (a compat widening only), hence a patch bump under 0.x."
          git commit -m "$MSG"
          git push -u origin chore/release-after-compat
          BODY="A \`[compat]\` widening landed on **$CURR**, which is already registered."
          BODY="$BODY"$'\n\n'"A registered package's compat is **frozen at its registered version**, so the widening is invisible downstream until a new version ships — the resolver keeps reading the old entry and keeps picking the old dependency."
          BODY="$BODY"$'\n\n'"CompatHelper files the two *ends* of each hop (upstream widen, downstream widen) and never the release between them; \`AutoRegister\` fires on a version **change**, which a CompatHelper merge is not. This PR is that missing middle link, opened automatically by \`release-after-compat.yml\`."
          BODY="$BODY"$'\n\n'"**Patch bump** — a compat widening is backward-compatible."
          gh pr create --repo "$GITHUB_REPOSITORY" --head chore/release-after-compat \
            --title "chore: release $NEXT — carry the compat widening downstream" \
            --body "$BODY"
