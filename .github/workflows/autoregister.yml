name: AutoRegister

# Reusable. The per-repo caller is triggered by `workflow_run` after "Release Drafter"
# completes on main. On a Project.toml VERSION BUMP it branches by repo visibility:
#   PUBLIC  → request General registration via a @JuliaRegistrator comment
#             (→ JuliaTagBot → the repo's TagBot → PublishRelease).
#   PRIVATE → tag vX.Y.Z AND publish the GitHub Release, both HERE, in one step.
# Runs on ubuntu-latest: lightweight (git + gh), and public repos cannot use the private
# rosina pool anyway.
#
# Why private does the release itself (does NOT delegate to PublishRelease): an Action-pushed
# tag does not reliably trigger the repo's PublishRelease — a GITHUB_TOKEN-pushed tag triggers
# nothing, GitHub suppresses the push event when >3 tags are pushed at once, and PublishRelease
# runs only on the (sometimes-unavailable) rosina pool. That fragility left a whole run of tags
# (v0.4.11+) created but their releases stuck as unpublished drafts. Publishing here — on
# ubuntu-latest, idempotently, even when the tag already exists — removes every one of those
# dependencies. If the tag push happens to also trigger PublishRelease, that just re-edits an
# already-published release (harmless).
on:
  workflow_call:
    inputs:
      # `runs-on` for the FIRST job, as JSON: '"ubuntu-latest"' or '["self-hosted","rosina"]'.
      #
      # Defaults to hosted, and the default is load-bearing rather than lazy: this reusable serves
      # PUBLIC callers too, the org runner group is `allows_public: false`, and a public repo asking
      # for `[self-hosted, rosina]` does not fail — it QUEUES FOREVER. So the safe default is the one
      # that works everywhere, and private callers opt in.
      #
      # Private callers SHOULD pass the pool. On the free plan only private repos consume the org's
      # 2000 included minutes/month, and measured 2026-08-09 this job was one of only two hosted jobs
      # still firing regularly across the private fleet. `register-lab` below is already pinned to
      # the pool unconditionally — it has to be, since it needs the persistent org git login.
      runner:
        type: string
        default: '"ubuntu-latest"'
    secrets:
      # BOT_PAT (org secret) must be DECLARED so it reliably reaches this reusable
      # workflow from a `workflow_run`-triggered caller — `secrets: inherit` alone was
      # dropping it, so the tag got pushed with GITHUB_TOKEN and did NOT trigger
      # PublishRelease. Declaring it makes the contract explicit. `required: false` so a
      # repo without BOT_PAT still falls back to github.token (public/@JuliaRegistrator path).
      BOT_PAT:
        required: false

jobs:
  autoregister:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      curr: ${{ steps.v.outputs.curr }}
    permissions:
      # Must NOT exceed what the per-repo callers grant (contents+issues) — a reusable workflow
      # requesting a permission the caller omits fails to START ("workflow file issue"). Do NOT add
      # `pull-requests: read` here: build_release_notes.py's `gh pr list` runs with GH_TOKEN=BOT_PAT
      # (a PAT that already carries PR read); without BOT_PAT it degrades gracefully to auto-notes.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          token: ${{ secrets.BOT_PAT || github.token }}

      - name: Detect version bump
        id: v
        run: |
          PREV=$(git show HEAD~1:Project.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
          CURR=$(grep '^version' Project.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "curr=$CURR" >> "$GITHUB_OUTPUT"
          if [ "$PREV" != "$CURR" ] && [ -n "$CURR" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version: $PREV -> $CURR"

      - name: Public → request General registration (@JuliaRegistrator)
        if: steps.v.outputs.changed == 'true' && github.event.repository.private == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf '@JuliaRegistrator register\n\n## Changelog\n\nRelease v%s.' "${{ steps.v.outputs.curr }}")
          gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/comments" \
            -f body="$BODY"
          echo "Requested General registration for v${{ steps.v.outputs.curr }}"

      - name: Private → tag + publish GitHub Release (no registry)
        if: steps.v.outputs.changed == 'true' && github.event.repository.private == true
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
        run: |
          set -eo pipefail
          TAG="v${{ steps.v.outputs.curr }}"

          # 1) tag (idempotent) — but do NOT stop if it already exists; still (re)publish below.
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "${{ github.event.workflow_run.head_sha }}"
            git push origin "$TAG"
            echo "Pushed tag $TAG"
          else
            echo "Tag $TAG already exists — proceeding to (re)publish its release"
          fi

          # 2) Build release notes, guaranteeing they are never empty.
          #    Prefer the repo's rich notes script. It lists PRs via the SEARCH API, which the
          #    ephemeral GITHUB_TOKEN cannot use on a PRIVATE repo — and on the Free plan the org
          #    BOT_PAT is NOT delivered to private repos, so `secrets.BOT_PAT` is empty here. The
          #    script then emits "No merged pull requests" (exit 0), which previously got published
          #    as-is. So: use the rich notes only when they are non-empty AND not that placeholder;
          #    otherwise fall back to GitHub's server-side generated notes. Those are composed
          #    server-side from the merged PRs, so they work with GITHUB_TOKEN's contents:write and
          #    need neither a PAT nor the (token-gated, eventually-consistent) search index.
          NOTES_FILE=/tmp/release-notes.md
          have_notes=false
          if [ -f .github/scripts/build_release_notes.py ] \
             && python3 .github/scripts/build_release_notes.py --tag "$TAG" >"$NOTES_FILE" 2>/tmp/notes.err \
             && [ -s "$NOTES_FILE" ] \
             && ! grep -q "No merged pull requests" "$NOTES_FILE"; then
            have_notes=true
            echo "Using rich notes from build_release_notes.py"
          elif gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                 -f tag_name="$TAG" --jq '.body' >"$NOTES_FILE" 2>/tmp/notes.err \
               && [ -s "$NOTES_FILE" ]; then
            have_notes=true
            echo "Using GitHub server-side generated notes"
          else
            echo "Could not build release notes: $(cat /tmp/notes.err 2>/dev/null)"
          fi

          # 3) publish: overwrite the Release Drafter draft if one exists, else create.
          NOTES_ARGS=()
          if [ "$have_notes" = true ]; then NOTES_ARGS=(--notes-file "$NOTES_FILE"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --draft=false "${NOTES_ARGS[@]}"
          elif [ ${#NOTES_ARGS[@]} -gt 0 ]; then
            gh release create "$TAG" --title "$TAG" "${NOTES_ARGS[@]}"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          echo "Published release $TAG"

  # ─────────────────────────────────────────────────────────────────────────────
  # PRIVATE → also register the version in LabRegistry, as a PR.
  #
  # WHY THIS EXISTS. CompatHelper resolves "latest version" by looking a dependency's UUID up in a
  # reachable REGISTRY; it has no code path that reads `[sources]`. Private packages were registered
  # nowhere, so every internal `[compat]` bound was invisible to it and had to be bumped by hand —
  # that is what ParameterizedITensor#159 was. LabRegistry exists to make the version NUMBER
  # discoverable. It is NOT how anything resolves: internal deps stay pinned `[sources] rev = "main"`
  # by fleet policy, and that still decides the commit.
  #
  # WHY A SEPARATE JOB ON `rosina`. Registering is a CROSS-REPO write. This repo's `github.token`
  # cannot touch LabRegistry, and `BOT_PAT` is an org secret GitHub Free does not deliver to PRIVATE
  # repos — which is precisely the branch this runs on. The `rosina` pool carries the persistent org
  # login CI already uses to clone private `[sources]` deps. It needs no extra `permissions:` for the
  # same reason: nothing here is done with this repo's token.
  #
  # WHY A PR AND NOT A PUSH. LabRegistry's CI re-clones the package and confirms the recorded
  # `git-tree-sha1` really exists and that the Project.toml at that tree agrees on name/uuid/version;
  # its AutoMerge lands the PR when that is green. Pushing straight to main would skip the only check
  # that can catch a bad registration.
  #
  # LabRegistry's nightly `Sync` job is the BACKSTOP, not the primary path — it catches releases that
  # happened while the pool was down. This job is what makes registration prompt.
  register-lab:
    needs: autoregister
    if: >
      needs.autoregister.outputs.changed == 'true' &&
      github.event.repository.private == true
    runs-on: [self-hosted, rosina]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Register in LabRegistry (PR)
        env:
          PKG_VERSION: ${{ needs.autoregister.outputs.curr }}
          REG: ${{ runner.temp }}/LabRegistry
        run: |
          set -euo pipefail
          cred="$(gh auth token 2>/dev/null || true)"
          if [ -z "$cred" ]; then
            echo "::warning::no rosina login here — skipping; the nightly Sync job will pick this version up"
            exit 0
          fi
          echo "::add-mask::$cred"
          export GH_TOKEN="$cred"

          rm -rf "$REG"
          gh repo clone lab-sotashimozono/LabRegistry "$REG" -- -q

          # Only versions of packages ALREADY in the registry. `Registry.toml`'s `[packages]` is the
          # curated list, and adding to it stays a human decision — a new package registering itself
          # on its first release is not something CI should decide.
          name=$(grep -m1 '^name' Project.toml | sed 's/.*"\(.*\)"/\1/')
          if ! grep -q "name = \"$name\"" "$REG/Registry.toml"; then
            echo "$name is not in LabRegistry's curated [packages] — nothing to do."
            exit 0
          fi

          # LocalRegistry COMMITS the registration itself, so (a) the runner needs a git identity
          # before Julia runs — the registry's own first rosina run died on exactly this, with
          # "unable to auto-detect email address" — and (b) "did anything happen" is a COMMIT
          # comparison, not `git diff`, because the tree is clean either way.
          git -C "$REG" config user.name  'github-actions[bot]'
          git -C "$REG" config user.email 'github-actions[bot]@users.noreply.github.com'
          before=$(git -C "$REG" rev-parse HEAD)

          julia --startup-file=no --color=yes -e '
            using Pkg; Pkg.activate(; temp = true); Pkg.add("LocalRegistry")
            using LocalRegistry
            register(pwd(); registry = ENV["REG"], push = false,
                     repo = "https://github.com/" * ENV["GITHUB_REPOSITORY"] * ".git")' \
            || { echo "::warning::register failed (already registered?) — Sync will reconcile"; exit 0; }

          after=$(git -C "$REG" rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "nothing new to register"
            exit 0
          fi

          branch="register/$name-v${PKG_VERSION}"
          git -C "$REG" checkout -q -b "$branch"
          git -C "$REG" push -q -u origin "$branch"
          gh pr create --repo lab-sotashimozono/LabRegistry --base main --head "$branch" \
            --title "Register $name v${PKG_VERSION}" \
            --body "Automated on the release of \`$name\` v${PKG_VERSION}.

          Registered so CompatHelper can see the version. Resolution is unaffected — internal deps
          stay pinned \`[sources] rev = \"main\"\`."
