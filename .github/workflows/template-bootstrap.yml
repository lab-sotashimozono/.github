name: Template bootstrap

# Reusable ONE-SHOT initialization for a repository created from a template repo
# (lab-sotashimozono/skeleton.jl). Its only caller is the template's own
# .github/workflows/TemplateBootstrap.yml, which rides along into every generated repo.
#
# WHY this exists: a template copy is byte-identical to the template. The module is still
# `MyModule` and — the dangerous part — Project.toml still carries the TEMPLATE's UUID, so
# two packages generated from it collide in a shared environment. Left to a human TODO this
# is reliably forgotten (it was, twice). This job runs the template's own
# `setup_project.jl` on the first push to `main` of a derived repo, deriving the package
# name from the repository name (`Foo.jl` → `Foo`), and commits the result.
#
# Guards — both must hold, so the caller is safe to leave enabled forever:
#   * never runs in the template itself (`template-repo` check),
#   * no-ops once initialized: `marker` existing IS the "not yet done" flag, which the
#     script re-checks itself, so a race cannot double-apply it.
#
# The pool follows the CALLER's visibility, like the rest of the hub's reusables — private ->
# rosina, public -> ubuntu-latest. Canonical note: `autoregister.yml`.
#
# This job used to pin `ubuntu-latest` unconditionally, reasoning that a one-shot ~1-minute
# job should favour robustness over minute-shaving and that self-hosted runners refuse
# PUBLIC-repo jobs. The second half is still true and is why public callers keep
# ubuntu-latest. The first half was wrong in the direction that matters: hosted minutes are
# a finite, shared, PRIVATE-repo-only budget, and when they run out the job does not skip —
# it FAILS, in ~3 s, with no runner assigned and no step logged. `StructuredITensors.jl`
# accumulated 6 such failures on `main` after it was already initialized, which is the worst
# shape a guard can take: red, permanent, and about work that no longer needs doing.
# A private caller now lands on rosina, where it initializes for real.
#
# The commit is pushed with GITHUB_TOKEN, which by design does NOT trigger further workflow
# runs: no loop, but also no CI on the bootstrap commit — CI runs on the next human push.
# For the same reason the caller cannot delete itself afterwards: GitHub forbids
# GITHUB_TOKEN from creating or updating files under `.github/workflows/`. The caller is
# inert after the first run and can be deleted by hand at any time. The setup script must
# likewise leave `.github/workflows/` untouched, or this push is rejected.

on:
  workflow_call:
    inputs:
      # `runs-on` as JSON. **Leave unset** and the pool follows the CALLER's visibility —
      # private -> rosina, public -> ubuntu-latest. Canonical note: `autoregister.yml`.
      runner:
        description: 'runs-on as JSON: ''"ubuntu-latest"'' or ''["self-hosted","rosina"]'''
        type: string
        default: ''
      template-repo:
        description: 'owner/name of the template itself — never bootstrapped'
        type: string
        default: 'lab-sotashimozono/skeleton.jl'
      script:
        description: 'initialization script in the CALLER repo; receives the package name'
        type: string
        default: '.github/scripts/setup_project.jl'
      marker:
        description: 'file whose presence means "not yet initialized"'
        type: string
        default: 'src/MyModule.jl'

jobs:
  bootstrap:
    name: Initialize package from repository name
    if: github.repository != inputs.template-repo
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || (github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this repository is still uninitialized
        id: check
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          set -euo pipefail
          if [ -f "$MARKER" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Already initialized ($MARKER is gone) — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: julia-actions/setup-julia@v2
        if: steps.check.outputs.run == 'true'
        with:
          version: '1'

      - name: Run the initialization script
        if: steps.check.outputs.run == 'true'
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          PKG="${GITHUB_REPOSITORY##*/}"    # owner/Foo.jl → Foo.jl
          PKG="${PKG%.jl}"                  # Foo.jl       → Foo
          echo "Initializing package '$PKG'"
          julia "$SCRIPT" "$PKG"

      - name: Commit and push
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `-A` is correct here: the script RENAMES the module file and rewrites many
          # others, and this is a clean, single-purpose checkout.
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PKG="${GITHUB_REPOSITORY##*/}"; PKG="${PKG%.jl}"
          git commit -m "Initialize ${PKG} from the template" \
                     -m "Renames the placeholder module, assigns a fresh UUID, and sets the version to 0.1.0. Generated by the reusable template-bootstrap workflow."
          git push origin HEAD:main
          {
            echo "### Bootstrapped \`${PKG}\`"
            echo
            echo "- module renamed, **fresh UUID** assigned, version set to \`0.1.0\`"
            echo "- CI did not run on this commit (GITHUB_TOKEN pushes trigger no workflows) — it runs on your next push"
            echo "- remaining manual steps are in the README's TODO list"
            echo "- \`.github/workflows/TemplateBootstrap.yml\` is now inert; delete it whenever you like"
          } >> "$GITHUB_STEP_SUMMARY"
